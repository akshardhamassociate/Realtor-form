<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>रियल्टर ऑनबोर्डिंग फॉर्म — अक्षरधाम एसोसिएट्स</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root{
  /* brand — taken from the Akshardham mark */
  --brand:#DD6820;
  --brand-2:#F2B21C;
  --brand-soft:#FCEFE1;
  /* warm neutrals */
  --paper:#EBE8E3;
  --sheet:#FFFFFF;
  --field:#F8F6F3;
  --ink:#1B1714;
  --ink-2:#6E635A;
  --ink-3:#A2988F;
  --line:#E2DED7;
  --line-soft:#EFECE7;
  --good:#2C7A52; --good-soft:#E8F2EC; --bad:#B23B22;
  --shadow:0 1px 1px rgba(27,23,20,.04), 0 18px 40px -26px rgba(27,23,20,.4);
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#F08A3C; --brand-2:#F5BE3E; --brand-soft:#2C1E11;
    --paper:#121110; --sheet:#1C1917; --field:#232019;
    --ink:#F0EBE5; --ink-2:#A79C92; --ink-3:#7B7168;
    --line:#332E28; --line-soft:#272320;
    --good:#5FBD8C; --good-soft:#16301F; --bad:#E4836A;
    --shadow:0 1px 1px rgba(0,0,0,.4), 0 18px 40px -26px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --brand:#F08A3C; --brand-2:#F5BE3E; --brand-soft:#2C1E11;
  --paper:#121110; --sheet:#1C1917; --field:#232019;
  --ink:#F0EBE5; --ink-2:#A79C92; --ink-3:#7B7168;
  --line:#332E28; --line-soft:#272320;
  --good:#5FBD8C; --good-soft:#16301F; --bad:#E4836A;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 18px 40px -26px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Mukta','Noto Sans Devanagari',system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
.wrap{max-width:920px;margin:0 auto;padding:0 16px;padding-block:34px 104px}

/* ---------- letterhead ---------- */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.mast{background:#fff;padding:30px 28px 24px;text-align:center;border-bottom:1px solid var(--line-soft)}
.mast img{width:min(240px,62%);height:auto;display:block;margin:0 auto}
.rule{height:3px;background:linear-gradient(90deg,var(--brand) 0%,var(--brand-2) 55%,var(--brand) 100%)}

.docttl{padding:26px 28px 22px;border-bottom:1px solid var(--line-soft)}
.docttl .kicker{
  font-size:13px;font-weight:700;letter-spacing:.07em;
  color:var(--brand);margin:0 0 8px
}
.docttl h1{font-size:clamp(25px,4.6vw,33px);line-height:1.28;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.docttl p{margin:9px 0 0;color:var(--ink-2);font-size:15.5px;max-width:60ch}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;background:var(--field)}
.tab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;font:inherit;font-weight:600;font-size:15.5px;color:var(--ink-3);padding:14px 15px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tab:hover{color:var(--ink-2)}
.tab:focus-visible{outline:2px solid var(--brand);outline-offset:-3px;border-radius:4px}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:16px;padding:20px 28px;background:var(--field);border-bottom:1px solid var(--line-soft)}

/* ---------- sections ---------- */
.sec{border-bottom:1px solid var(--line-soft)}
.sec:last-of-type{border-bottom:none}
.sechead{display:flex;align-items:center;gap:12px;padding:26px 28px 0}
.secno{
  font-family:'Roboto Mono',ui-monospace,monospace;font-size:12.5px;font-weight:500;
  color:var(--brand);background:var(--brand-soft);
  border-radius:5px;padding:3px 8px;flex:none;letter-spacing:.04em;
}
.sechead h2{font-size:20px;margin:0;font-weight:700;letter-spacing:-.005em}
.sechint{padding:8px 28px 0;color:var(--ink-3);font-size:14.5px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;padding:18px 28px 28px}
.full{grid-column:1/-1}

/* ---------- fields ---------- */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > label{font-size:13.5px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.f input,.f textarea{
  font:inherit;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 14px;width:100%;min-width:0;
  transition:border-color .14s,background .14s,box-shadow .14s;
}
.f textarea{resize:vertical;min-height:74px;line-height:1.55}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--brand);background:var(--sheet);box-shadow:0 0 0 3px var(--brand-soft)}
.f input::placeholder,.f textarea::placeholder{color:var(--ink-3)}
.f input[readonly]{color:var(--ink-2);cursor:default}
.num input{font-family:'Roboto Mono',ui-monospace,monospace;font-size:15.5px;font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ---------- checkbox pills ---------- */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--line);border-radius:99px;padding:8px 16px 8px 12px;font-size:15px;background:var(--field);user-select:none;transition:border-color .14s,background .14s}
.pill input{accent-color:var(--brand);margin:0;width:17px;height:17px;flex:none}
.pill:hover{border-color:var(--ink-3)}
.pill:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--ink);font-weight:600}
.pill:focus-within{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- notices ---------- */
.notice{margin:0 28px;padding:14px 17px;border:1px solid var(--line);border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:var(--r-sm);font-size:15px;line-height:1.7}
.notice b{color:var(--brand)}
.notice.ink{border-left-color:var(--ink-2);background:var(--field)}
.notice.ink b{color:var(--ink)}

/* ---------- commission slabs ---------- */
.slabs{display:flex;flex-direction:column;gap:8px;padding:18px 28px 6px}
.slab{display:grid;grid-template-columns:minmax(116px,1fr) minmax(0,1.15fr);align-items:center;gap:16px;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 15px;background:var(--field)}
.slab .rng{font-weight:600;font-size:16.5px;line-height:1.35}
.slab .rng span{color:var(--ink-3);font-weight:400;font-size:13.5px;display:block}
.slab input{font:inherit;font-family:'Roboto Mono',ui-monospace,monospace;font-size:15.5px;font-variant-numeric:tabular-nums;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;width:100%;color:var(--ink);transition:border-color .14s,box-shadow .14s}
.slab input::placeholder{font-family:'Mukta',sans-serif;color:var(--ink-3)}
.slab input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* ---------- declaration ---------- */
.declare{margin:18px 28px 0;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--field);font-size:15.5px;line-height:1.8}
.agree{display:flex;gap:11px;align-items:flex-start;margin-top:16px;cursor:pointer;font-weight:600}
.agree input{accent-color:var(--good);width:18px;height:18px;margin:3px 0 0;flex:none}

.signrow{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:26px 28px 10px}
.signbox .ln{border-bottom:1px solid var(--ink-3);height:48px}
.signbox .cap{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:8px}

/* ---------- action bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -10px 28px -22px rgba(0,0,0,.7)}
.barin{max-width:920px;margin:0 auto;padding:12px 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.status{font-size:14.5px;color:var(--ink-3);margin-right:auto;min-width:110px}
.status.ok{color:var(--good);font-weight:600}
.status.bad{color:var(--bad);font-weight:600}
button.btn{font:inherit;font-weight:600;font-size:15.5px;cursor:pointer;border-radius:var(--r-sm);padding:11px 19px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);transition:border-color .14s,background .14s}
button.btn:hover{border-color:var(--ink-3);background:var(--field)}
button.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.btn.primary:hover{background:#C85A18;border-color:#C85A18}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- submissions ---------- */
.subs{padding:24px 28px 30px;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:12px 18px;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 17px;background:var(--field)}
.row h3{margin:0;font-size:17.5px;font-weight:700}
.row .sub{color:var(--ink-2);font-size:14.5px;margin-top:3px}
.row .no{font-family:'Roboto Mono',ui-monospace,monospace;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r-sm);padding:38px 22px;text-align:center;color:var(--ink-3);font-size:15.5px;line-height:1.85}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--good-soft);color:var(--good)}

@media (max-width:640px){
  .wrap{padding-block:20px 104px}
  .mast{padding:24px 18px 20px}
  .docttl,.sechead,.sechint,.grid,.strip,.tabs,.slabs,.subs{padding-left:18px;padding-right:18px}
  .notice,.declare{margin-left:18px;margin-right:18px}
  .signrow{grid-template-columns:1fr;padding-left:18px;padding-right:18px}
  .grid{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print ---------- */
@media print{
  :root{--paper:#fff;--sheet:#fff;--field:#fff;--ink:#000;--ink-2:#333;--ink-3:#666;--line:#999;--line-soft:#ccc;--brand:#B8551A;--brand-soft:#fff;--good-soft:#fff;--shadow:none}
  body{background:#fff;font-size:11.5pt}
  .wrap{max-width:none;padding:0}
  .bar,.tabs,#viewSubs,.noprint{display:none!important}
  .sheet{border:none;box-shadow:none;border-radius:0}
  .rule{background:#B8551A!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .secno{border:1px solid #B8551A;background:#fff}
  .sechead{break-after:avoid}
  .f input,.f textarea,.slab input{border:none;border-bottom:1px dotted #777;border-radius:0;padding:4px 2px;background:#fff;box-shadow:none}
  .pill{border:1px solid #777;background:#fff}
  .notice,.declare{background:#fff}
}
</style>
</head>

    <button class="btn" id="btnNew" type="button">नया</button>
    <button class="btn primary" id="btnSave" type="button">फॉर्म सेव करें</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     Google Sheet से जोड़ने के लिए — Apps Script वेब ऐप का URL
     यहाँ डाल दीजिए। खाली रहा तो फॉर्म सिर्फ़ इसी डिवाइस में
     सेव होगा (ब्राउज़र स्टोरेज)।
     ========================================================= */
  var SHEET_URL = "https://script.google.com/macros/s/AKfycbxnA1h7vARhNdm-Jm-zN4EzBbZCVGc7aGyOCa9pGt_-1RVQ2ElCt_pY6s9S-MqDyvDvfQ/exec";

  var SCHEMA = [
    { no:"01", title:"रियल्टर / कॉलोनाइज़र विवरण", fields:[
      {id:"r_name",   l:"नाम", full:true, ph:"जैसे — महेश अग्रवाल"},
      {id:"r_firm",   l:"फर्म / कंपनी का नाम", full:true},
      {id:"r_mobile", l:"मोबाइल नंबर", t:"tel", num:true},
      {id:"r_wa",     l:"WhatsApp नंबर", t:"tel", num:true},
      {id:"r_addr",   l:"पूरा पता", t:"area", full:true},
      {id:"r_email",  l:"ईमेल"},
      {id:"r_since",  l:"कब से इस काम में", ph:"जैसे — 2011 से"},
      {id:"r_other",  l:"अन्य चालू प्रोजेक्ट्स", t:"area", full:true}
    ]},
    { no:"02", title:"प्रोजेक्ट विवरण", fields:[
      {id:"p_name",  l:"प्रोजेक्ट / कॉलोनी का नाम", full:true},
      {id:"p_loc",   l:"लोकेशन (लैंडमार्क सहित)", full:true},
      {id:"p_total", l:"कुल प्लॉट्स", num:true},
      {id:"p_avail", l:"वर्तमान में उपलब्ध", num:true},
      {id:"p_sizes", l:"प्लॉट साइज़ (छोटे से बड़े)", ph:"जैसे — 900 से 2400 वर्ग फुट"},
      {id:"p_rate",  l:"वर्तमान बिक्री दर", num:true, ph:"प्रति वर्ग फुट / गज"},
      {id:"p_appr",  l:"अप्रूवल / RERA / पट्टा स्थिति"},
      {id:"p_dev",   l:"विकास कार्य की स्थिति", ph:"रोड, बिजली, पानी, पार्क"},
      {id:"p_docs",  l:"साथ मिले दस्तावेज़", t:"checks", full:true,
        opts:["रेट लिस्ट","ले-आउट नक्शा","ब्रोशर","प्रोजेक्ट फोटो","गूगल लोकेशन","ड्रोन वीडियो"]}
    ]},
    { no:"03", title:"प्रोजेक्ट सेल्स टीम", hint:"जिन लोगों से अक्षरधाम की टीम सीधे बात कर सके", fields:[
      {id:"t_mgr",    l:"प्रोजेक्ट मैनेजर — नाम"},
      {id:"t_mgr_m",  l:"मोबाइल", t:"tel", num:true},
      {id:"t_exec",   l:"सेल्स एग्ज़ीक्यूटिव — नाम"},
      {id:"t_exec_m", l:"मोबाइल", t:"tel", num:true},
      {id:"t_tele",   l:"टेलीकॉलर / ऑफिस — नाम"},
      {id:"t_tele_m", l:"मोबाइल", t:"tel", num:true},
      {id:"t_agents", l:"आपके एजेंट्स (नाम एवं मोबाइल)", t:"area", full:true}
    ]},
    { no:"04", title:"कमीशन स्लैब", slabs:true, fields:[
      {id:"c_when", l:"कमीशन भुगतान कब एवं कितना", t:"area", full:true, ph:"जैसे — बयाना पर 1%, रजिस्ट्री पर शेष"}
    ]},
    { no:"05", title:"विशेष शर्तें", hint:"कोई शर्त न हो तो उस पंक्ति में ‘लागू नहीं’ लिखें", fields:[
      {id:"s_pay",    l:"भुगतान संबंधी शर्त", t:"area", full:true},
      {id:"s_book",   l:"बुकिंग संबंधी शर्त", t:"area", full:true},
      {id:"s_cancel", l:"कैंसिलेशन संबंधी शर्त", t:"area", full:true},
      {id:"s_other",  l:"अन्य कोई विशेष शर्त", t:"area", full:true}
    ]}
  ];

  var SLABS = [
    {id:"slab_1", r:"1 प्लॉट",       s:"सामान्य एजेंट दर"},
    {id:"slab_2", r:"2 – 5 प्लॉट",   s:"छोटा सौदा"},
    {id:"slab_3", r:"6 – 10 प्लॉट",  s:"मध्यम सौदा"},
    {id:"slab_4", r:"11 – 20 प्लॉट", s:"बल्क सौदा"},
    {id:"slab_5", r:"21+ प्लॉट",     s:"पूर्ण प्रोजेक्ट"}
  ];

  var DECLARATION = "मैं यह जानकारी अक्षरधाम एसोसिएट्स को अपनी स्वेच्छा से दे रहा हूँ। मैं इस फॉर्म में लिखी दरों पर अपने प्लॉट्स बेचने हेतु सहमत हूँ तथा ऊपर भरे गए कमीशन स्लैब के अनुसार कमीशन देने के लिए तैयार हूँ। इसके अतिरिक्त मेरी जो भी शर्तें हैं, वे इस फॉर्म में अथवा साथ संलग्न कागज़ पर लिखी हुई हैं। दी गई समस्त जानकारी मेरी जानकारी में सही एवं पूर्ण है।";

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]; }); };

  /* ---------- build ---------- */
  function fieldHtml(f){
    var cls = "f" + (f.num ? " num" : "") + (f.full ? " full" : "");
    var ph = f.ph ? ' placeholder="' + esc(f.ph) + '"' : "";
    var inner;
    if (f.t === "area") inner = '<textarea id="' + f.id + '" rows="2"' + ph + "></textarea>";
    else if (f.t === "checks") inner = '<div class="pills">' + f.opts.map(function(o,i){
      return '<label class="pill"><input type="checkbox" id="' + f.id + "_" + i + '" data-group="' + f.id +
             '" value="' + esc(o) + '"><span>' + esc(o) + "</span></label>"; }).join("") + "</div>";
    else inner = '<input id="' + f.id + '" type="' + (f.t || "text") + '"' + ph + ">";
    return '<div class="' + cls + '"><label for="' + f.id + '">' + esc(f.l) + "</label>" + inner + "</div>";
  }

  function build(){
    var html = SCHEMA.map(function(sec){
      var out = '<section class="sec"><div class="sechead"><span class="secno">' + sec.no +
                "</span><h2>" + esc(sec.title) + "</h2></div>";
      if (sec.hint) out += '<p class="sechint">' + esc(sec.hint) + "</p>";
      if (sec.slabs) {
        out += '<div class="notice"><b>क्यों ज़रूरी है —</b> प्राप्त कमीशन का लगभग 80% हिस्सा हम ग्राहक तक लाभ/डिस्काउंट के रूप में पहुँचाते हैं और केवल 20% अपने पास रखते हैं। इसलिए आप जितना अधिक कमीशन तय करेंगे, उतने अधिक प्लॉट उतनी ही तेज़ी से बिकेंगे।</div>';
        out += '<div class="slabs">' + SLABS.map(function(s){
          return '<div class="slab"><div class="rng">' + esc(s.r) + "<span>" + esc(s.s) + "</span></div>" +
                 '<input id="' + s.id + '" placeholder="% अथवा प्रति प्लॉट राशि" aria-label="' + esc(s.r) + ' पर कमीशन"></div>';
        }).join("") + "</div>";
      }
      out += '<div class="grid">' + sec.fields.map(fieldHtml).join("") + "</div></section>";
      return out;
    }).join("");

    html += '<section class="sec"><div class="sechead"><span class="secno">06</span><h2>घोषणा एवं हस्ताक्षर</h2></div>' +
            '<div class="declare">' + esc(DECLARATION) +
            '<label class="agree"><input type="checkbox" id="d_agree"><span>मैंने उपरोक्त घोषणा पढ़ ली है और सहमत हूँ</span></label></div>' +
            '<div class="grid"><div class="f"><label for="d_name">हस्ताक्षरकर्ता का नाम</label><input id="d_name"></div>' +
            '<div class="f"><label for="d_desig">पद / हैसियत</label><input id="d_desig" placeholder="प्रोप्राइटर / पार्टनर / डायरेक्टर"></div></div>' +
            '<div class="signrow"><div class="signbox"><div class="ln"></div><div class="cap">रियल्टर / कॉलोनाइज़र के हस्ताक्षर एवं मोहर</div></div>' +
            '<div class="signbox"><div class="ln"></div><div class="cap">अक्षरधाम प्रतिनिधि के हस्ताक्षर</div></div></div>' +
            '<div class="notice ink" style="margin-top:22px;margin-bottom:26px"><b>आगे क्या होगा —</b> फॉर्म मिलते ही आपका प्रोजेक्ट हमारी टेलीकॉलिंग, एजेंट नेटवर्क, रिटेलर नेटवर्क और डिजिटल माध्यमों पर लाना शुरू कर दिया जाएगा। आपसे कोई फीस या एडवांस नहीं लिया जाएगा — कमीशन केवल बिक्री होने पर देय होगा।</div></section>';

    $("sections").innerHTML = html;
  }

  /* ---------- values ---------- */
  function simpleIds(){
    var ids = [];
    SCHEMA.forEach(function(s){ s.fields.forEach(function(f){ if (f.t !== "checks") ids.push(f.id); }); });
    SLABS.forEach(function(s){ ids.push(s.id); });
    return ids.concat(["formNo","formDate","formPlace","formRep","d_name","d_desig"]);
  }
  function checkGroups(){
    var g = [];
    SCHEMA.forEach(function(s){ s.fields.forEach(function(f){ if (f.t === "checks") g.push(f.id); }); });
    return g;
  }
  function collect(){
    var d = {};
    simpleIds().forEach(function(id){ var el = $(id); if (el) d[id] = el.value.trim(); });
    checkGroups().forEach(function(gid){
      d[gid] = [].slice.call(document.querySelectorAll('[data-group="' + gid + '"]:checked')).map(function(i){ return i.value; });
    });
    d.d_agree = !!($("d_agree") && $("d_agree").checked);
    return d;
  }
  function apply(d){
    simpleIds().forEach(function(id){ var el = $(id); if (el) el.value = d[id] || ""; });
    checkGroups().forEach(function(gid){
      var picked = d[gid] || [];
      [].slice.call(document.querySelectorAll('[data-group="' + gid + '"]')).forEach(function(i){
        i.checked = picked.indexOf(i.value) !== -1;
      });
    });
    if ($("d_agree")) $("d_agree").checked = !!d.d_agree;
  }

  var pad = function(v){ return String(v).length < 2 ? "0" + v : String(v); };
  function newFormNo(){
    var n = new Date(), rand = Math.floor(1000 + Math.random() * 9000);
    return "AKS-" + String(n.getFullYear()).slice(2) + pad(n.getMonth() + 1) + pad(n.getDate()) + "-" + rand;
  }
  function today(){ var n = new Date(); return n.getFullYear() + "-" + pad(n.getMonth() + 1) + "-" + pad(n.getDate()); }
  function fmtDate(iso){ var p = String(iso || "").split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : "—"; }

  var statusTimer;
  function say(msg, kind){
    var el = $("status");
    el.textContent = msg;
    el.className = "status" + (kind ? " " + kind : "");
    clearTimeout(statusTimer);
    if (kind) statusTimer = setTimeout(function(){ el.textContent = "तैयार"; el.className = "status"; }, 4500);
  }

  /* ---------- storage ---------- */
  var DRAFT = "aks.realtor.draft.v1", STORE = "aks.realtor.subs.v1";
  function lsGet(k, fb){ try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch(e){ return fb; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
  function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

  var rows = lsGet(STORE, []) || [];

  function pushToSheet(d){
    if (!SHEET_URL) return Promise.resolve(false);
    return fetch(SHEET_URL, {
      method: "POST", mode: "no-cors", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(d)
    }).then(function(){ return true; }).catch(function(){ return false; });
  }

  /* ---------- boot ---------- */
  build();
  var draft = lsGet(DRAFT, null);
  if (draft && draft.formNo) { apply(draft); say("पिछला अधूरा फॉर्म खोला गया"); }
  else { $("formNo").value = newFormNo(); $("formDate").value = today(); }

  function saveDraft(){ lsSet(DRAFT, collect()); }
  document.addEventListener("input", saveDraft);
  document.addEventListener("change", saveDraft);

  function show(which){
    var isForm = which === "form";
    $("viewForm").hidden = !isForm;
    $("viewSubs").hidden = isForm;
    $("tabForm").setAttribute("aria-selected", String(isForm));
    $("tabSubs").setAttribute("aria-selected", String(!isForm));
  }
  $("tabForm").addEventListener("click", function(){ show("form"); });
  $("tabSubs").addEventListener("click", function(){ show("subs"); });

  /* ---------- submissions list ---------- */
  function renderRows(){
    $("subCount").textContent = rows.length ? "(" + rows.length + ")" : "";
    if (!rows.length) {
      $("subsList").innerHTML = '<div class="empty">अभी कोई फॉर्म जमा नहीं हुआ है।<br>फॉर्म भरकर ‘फॉर्म सेव करें’ दबाइए — यहाँ दिखने लगेगा।</div>';
      return;
    }
    $("subsList").innerHTML = rows.map(function(r){
      var chips = [];
      if (r.d_agree) chips.push("सहमति ली गई");
      if (SLABS.some(function(s){ return r[s.id]; })) chips.push("स्लैब भरा हुआ");
      if (r.synced) chips.push("शीट में भेजा गया");
      return '<article class="row"><div><h3>' + esc(r.p_name || r.r_name || "(नाम नहीं)") + "</h3>" +
        '<div class="sub">' + esc(r.r_name || "—") + " · " + esc(r.formPlace || "—") + " · " + esc(fmtDate(r.formDate)) +
        " · " + esc(r.p_total || "?") + ' प्लॉट</div><div class="no">' + esc(r.formNo) + "</div>" +
        (chips.length ? '<div class="chips">' + chips.map(function(c){ return '<span class="chip">' + esc(c) + "</span>"; }).join("") + "</div>" : "") +
        '</div><div class="rowbtns"><button class="btn" type="button" data-open="' + esc(r.formNo) + '">खोलें</button>' +
        '<button class="btn" type="button" data-del="' + esc(r.formNo) + '">हटाएँ</button></div></article>';
    }).join("");
  }
  renderRows();

  $("subsList").addEventListener("click", function(e){
    var open = e.target.closest("[data-open]"), del = e.target.closest("[data-del]");
    if (open) {
      var r = rows.filter(function(x){ return x.formNo === open.getAttribute("data-open"); })[0];
      if (!r) return;
      apply(r); saveDraft(); show("form");
      window.scrollTo({ top: 0, behavior: "smooth" });
      say("फॉर्म खोला गया — " + r.formNo);
    } else if (del) {
      var no = del.getAttribute("data-del");
      if (!window.confirm(no + " को हटा दें?")) return;
      rows = rows.filter(function(x){ return x.formNo !== no; });
      lsSet(STORE, rows); renderRows();
      say("हटा दिया गया");
    }
  });

  /* ---------- save ---------- */
  $("btnSave").addEventListener("click", function(){
    var d = collect();
    if (!d.r_name || !d.r_mobile || !d.p_name) {
      say("रियल्टर का नाम, मोबाइल और प्रोजेक्ट का नाम ज़रूरी है", "bad");
      (!d.r_name ? $("r_name") : !d.r_mobile ? $("r_mobile") : $("p_name")).focus();
      return;
    }
    d.createdAt = new Date().toISOString();
    $("btnSave").disabled = true;
    say("सेव हो रहा है…");
    pushToSheet(d).then(function(sent){
      d.synced = sent;
      rows = rows.filter(function(x){ return x.formNo !== d.formNo; });
      rows.unshift(d);
      var okLocal = lsSet(STORE, rows);
      $("btnSave").disabled = false;
      renderRows();
      if (!okLocal) { say("इस डिवाइस में जगह नहीं बची — CSV निकालकर पुराने हटाएँ", "bad"); return; }
      lsDel(DRAFT);
      say(sent ? "सेव हो गया और शीट में भेज दिया — " + d.formNo : "सेव हो गया — " + d.formNo, "ok");
    });
  });

  $("btnNew").addEventListener("click", function(){
    apply({});
    $("formNo").value = newFormNo();
    $("formDate").value = today();
    lsDel(DRAFT); show("form");
    window.scrollTo({ top: 0, behavior: "smooth" });
    say("नया खाली फॉर्म तैयार");
  });

  $("btnPrint").addEventListener("click", function(){ window.print(); });

  /* ---------- csv ---------- */
  var CSV_COLS = (function(){
    var c = [["formNo","फॉर्म क्रमांक"],["formDate","दिनांक"],["formPlace","स्थान"],["formRep","प्रतिनिधि"]];
    SCHEMA.forEach(function(s){ s.fields.forEach(function(f){ c.push([f.id, f.l]); }); });
    SLABS.forEach(function(s){ c.push([s.id, "कमीशन " + s.r]); });
    c.push(["d_name","हस्ताक्षरकर्ता"],["d_desig","पद"],["d_agree","सहमति"],["createdAt","सेव समय"]);
    return c;
  })();

  function toCsv(list){
    var q = function(v){
      if (Array.isArray(v)) v = v.join(", ");
      if (v === true) v = "हाँ";
      if (v === false) v = "नहीं";
      return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    };
    var head = CSV_COLS.map(function(c){ return q(c[1]); }).join(",");
    var body = list.map(function(r){ return CSV_COLS.map(function(c){ return q(r[c[0]]); }).join(","); });
    return "﻿" + [head].concat(body).join("\r\n");
  }

  $("btnCsv").addEventListener("click", function(){
    if (!rows.length) { say("अभी कोई जमा फॉर्म नहीं है", "bad"); return; }
    var blob = new Blob([toCsv(rows)], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "akshardham-realtor-forms-" + today() + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    say("CSV डाउनलोड हो गया", "ok");
  });
})();
</script>
</body>
</html>
